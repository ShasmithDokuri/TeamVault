name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: teamvault_m3_review
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teamvault_m3_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEAMVAULT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/teamvault_m3_review
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify isolated PostgreSQL target
        run: node -e "const {Pool}=require('pg'); (async()=>{const p=new Pool({connectionString:process.env.TEAMVAULT_TEST_DATABASE_URL}); try { const r=await p.query('SELECT current_database() AS name'); if(r.rows[0].name!=='teamvault_m3_review') throw new Error('Unexpected test database'); console.log('Dedicated CI test database verified.'); } finally { await p.end(); }})().catch(e=>{console.error('Test database preflight failed:',e.message);process.exitCode=1})"

      - name: Run API and frontend unit/integration tests
        run: npm test

      - name: Build production frontend and API
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify installed top-level dependencies
        run: npm ls --depth=0

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run authenticated browser workflows
        run: npm run test:e2e --workspace @teamvault/web

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Validate Terraform without a backend
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Render Kubernetes manifests without a cluster
        run: |
          kubectl kustomize deploy/kubernetes/base >/dev/null
          kubectl kustomize deploy/kubernetes/migrations >/dev/null
