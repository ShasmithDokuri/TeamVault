apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: teamvault
resources:
  - namespace.yaml
  - service-accounts.yaml
  - config.yaml
  - services.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - outbox-worker.yaml
  - pod-disruption-budgets.yaml
images:
  - name: teamvault-api
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/teamvault-portfolio/api
    newTag: replace-with-immutable-git-sha
  - name: teamvault-web
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/teamvault-portfolio/web
    newTag: replace-with-immutable-git-sha
