apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: teamvault-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teamvault-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: teamvault-web
  labels:
    app.kubernetes.io/name: teamvault-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: teamvault-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
